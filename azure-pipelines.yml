# =======================================================
# ARQUIVO DE DIAGNÓSTICO TEMPORÁRIO
# Execute isso e nos mande o log da etapa "Diagnosticar Agente"
# =======================================================

trigger:
- "*" # Use qualquer branch que você usa para testar

variables:
  # Vamos definir isso apenas para ver se ajuda
  projectPath: ''
  javaVersion: '17'

stages:
- stage: Diagnostico
  displayName: 'Fase de Diagnóstico do Agente'
  jobs:
  - job: DebugJob
    displayName: 'Diagnosticar Agente'
    pool:
      vmImage: 'ubuntu-latest' # Mantenha o que você estava usando!
    
    steps:
    - task: Bash@3
      displayName: 'Rodando Diagnósticos...'
      inputs:
        targetType: 'inline'
        script: |
          echo "===== 1. ONDE ESTOU? ====="
          pwd
          
          echo "===== 2. QUEM SOU EU? ====="
          whoami
          
          echo "===== 3. VARIÁVEIS DE AMBIENTE (Filtradas) ====="
          printenv | sort | grep -E "AGENT_|JAVA_|MVN_|MAVEN_"
          
          echo "===== 4. ONDE ESTÃO OS BINÁRIOS? (PATH) ====="
          echo $PATH
          
          echo "===== 5. O JAVA PADRÃO EXISTE? ====="
          java -version
          
          echo "===== 6. ONDE ESTÃO OS JDKs INSTALADOS? ====="
          ls -la /usr/lib/jvm/
          
          echo "===== 7. O MAVEN PADRÃO EXISTE? ====="
          mvn -version
          
          echo "===== 8. TENTANDO ENCONTRAR O MAVEN... ====="
          find / -name mvn 2>/dev/null
          
          echo "===== DIAGNÓSTICO CONCLUÍDO ====="
