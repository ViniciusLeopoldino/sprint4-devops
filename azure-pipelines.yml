trigger:
- "*"

variables:
  javaVersion: '17'
  mavenArtifactName: 'mottu-control-*.jar'
  dockerfile: '**/Dockerfile'
  imageRepository: 'mottu-control' 
  artifactName: 'drop'
  dnsLabelApp: 'app-mottu-fiap-557047' 
  dnsLabelDb: 'db-mottu-fiap-557047' 
  
stages:
# -----------------------------------------------------
# ESTÁGIO DE CI (BUILD & PUBLISH)
# -----------------------------------------------------
- stage: Build
  displayName: 'CI - Build & Publish Artifact'
  jobs:
  - job: BuildAndTest
    displayName: 'Build and Publish'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: $(javaVersion)
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Maven@4
      displayName: 'Maven Package (Skip Tests)'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package'
        options: '-DskipTests'
        publishJUnitTestResults: false

    - task: CopyFiles@2
      displayName: 'Copy JAR and Dockerfile to Artifact Staging'
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)'
        Contents: |
          target/$(mavenArtifactName)
          $(dockerfile)
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        FlattenFolders: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: $(artifactName)
        publishLocation: 'Container'

# -----------------------------------------------------
# ESTÁGIO DE CD (DEPLOY)
# -----------------------------------------------------
- stage: Deploy
  displayName: 'CD - Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  
  jobs:
  - job: DeployToACI
    displayName: 'Deploy to ACI'
    pool:
      vmImage: 'ubuntu-latest'
      
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: $(artifactName)
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: Docker@2
      displayName: 'Login to ACR'
      inputs:
        command: 'login'
        containerRegistry: 'AcrConnection' 

    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: 'build'
        repository: $(imageRepository)
        tags: |
          $(Build.BuildId)
          latest
        dockerfile: '$(System.DefaultWorkingDirectory)/Dockerfile'
        buildContext: '$(System.DefaultWorkingDirectory)'

    - script: |
        docker tag $(imageRepository):$(Build.BuildId) $(imageRepository):latest
      displayName: 'Tag image as latest'

    - task: Docker@2
      displayName: 'Push Image to ACR'
      inputs:
        command: 'push'
        repository: $(imageRepository)
        containerRegistry: 'AcrConnection'
        tags: |
          $(Build.BuildId)
          latest

    - task: AzureCLI@2
      displayName: 'Deploy to Azure (DB & App)'
      inputs:
        azureSubscription: 'AzureSubscriptionConnection'
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Iniciando deploy do Banco de Dados PostgreSQL..."
          az container create `
            --resource-group $(resourceGroup) `
            --name $(postgresContainerName) `
            --image postgres:15 `
            --os-type Linux `
            --ports 5432 `
            --cpu 1 `
            --memory 1.5 `
            --environment-variables "POSTGRES_DB=$(postgresDb)" "POSTGRES_USER=$(postgresUser)" "POSTGRES_PASSWORD=$(postgresPassword)" `
            --dns-name-label $(dnsLabelDb) `
            --location $(location)

          echo "Aguardando 60s para o banco iniciar..."
          Start-Sleep -Seconds 60
          
          $POSTGRES_IP = $(az container show --resource-group $(resourceGroup) --name $(postgresContainerName) --query ipAddress.ip --output tsv)
          echo "IP do DB: $POSTGRES_IP"
          $ACR_LOGIN_SERVER = $(az acr show --name $(dockerRegistryName) --query loginServer -o tsv)
          echo "ACR Login Server: $ACR_LOGIN_SERVER"

          echo "Iniciando deploy da Aplicação Java..."
          az container create `
            --resource-group $(resourceGroup) `
            --name $(appContainerName) `
            --image "$ACR_LOGIN_SERVER/$(imageRepository):$(Build.BuildId)" `
            --os-type Linux `
            --ports 8080 `
            --cpu 1 `
            --memory 1.5 `
            --registry-login-server $ACR_LOGIN_SERVER `
            --registry-username $(dockerRegistryUsername) `
            --registry-password $(dockerRegistryPassword) `
            --environment-variables "DB_URL=jdbc:postgresql://$POSTGRES_IP:5432/$(postgresDb)" "DB_USER=$(postgresUser)" "DB_PASSWORD=$(postgresPassword)" `
            --dns-name-label $(dnsLabelApp) `
            --location $(location)
